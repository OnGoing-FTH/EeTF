<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title id="title">EeTF 256x256 Tile 网络特征流与推理回拼</title>
<desc id="desc">大图按原图划分后 Letterbox 到 256 倍数，切成 256x256 Tile；Tile 内切成 16x16 的 256 个 Patch，经过路由和双分支精细分割，再按坐标回拼。</desc>
<defs><style>
*{font-family:Arial,'Noto Sans CJK SC',sans-serif}.bg{fill:#f7f9fc}.group{fill:#fff;stroke:#d3dce8;stroke-width:2}.input{fill:#e7f5f2;stroke:#2e8f83;stroke-width:2.5}.tile{fill:#eaf2ff;stroke:#3974b8;stroke-width:2.5}.feature{fill:#fff3e5;stroke:#c77821;stroke-width:2.5}.router{fill:#f2edfb;stroke:#7452a8;stroke-width:2.5}.decoder{fill:#fdf0f5;stroke:#b24e76;stroke-width:2.5}.output{fill:#e8f7e8;stroke:#438c59;stroke-width:2.5}.note{fill:#fffbea;stroke:#b58a28;stroke-width:2}.title{font-size:36px;font-weight:700;fill:#172033}.subtitle{font-size:18px;fill:#526174}.section{font-size:22px;font-weight:700;fill:#334155}.bt{font-size:20px;font-weight:700;fill:#172033;text-anchor:middle}.tx{font-size:16px;fill:#344257;text-anchor:middle}.sm{font-size:14px;fill:#526174;text-anchor:middle}.shape{font-size:15px;font-weight:700;fill:#1f5f78;text-anchor:middle}.label{font-size:14px;font-weight:700;fill:#315f72;text-anchor:middle}.arrow{fill:none;stroke:#397080;stroke-width:2.7;marker-end:url(#arrow)}.purple{fill:none;stroke:#7452a8;stroke-width:2.7;marker-end:url(#purple)}.pink{fill:none;stroke:#b24e76;stroke-width:2.7;marker-end:url(#pink)}.gold{fill:none;stroke:#997125;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#gold)}.divider{stroke:#d3dce8;stroke-width:1.5;stroke-dasharray:6 8}.grid{fill:#d5e5fb;stroke:#3974b8;stroke-width:1}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#397080"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#7452a8"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#b24e76"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#997125"/></marker></defs>
<rect class="bg" width="2400" height="1500"/>
<text x="70" y="62" class="title">EeTF：256×256 Tile 训练、路由、精细分割与大图回拼</text>
<text x="70" y="96" class="subtitle">原图级 train/val 划分 ｜ 保持非正方形 ｜ Letterbox 到 256 倍数 ｜ Tile 内 16×16 Patch ｜ ONNX/TensorRT 固定 Tile 图</text>

<rect x="55" y="130" width="2290" height="300" rx="10" class="group"/><text x="82" y="168" class="section">A. 大图预处理与 Tile Batch</text><line x1="55" y1="188" x2="2345" y2="188" class="divider"/>
<rect x="90" y="245" width="285" height="130" rx="8" class="input"/><text x="232" y="282" class="bt">原始大图</text><text x="232" y="315" class="tx">保持原始 H×W 与长宽比</text><text x="232" y="347" class="shape">[3,H,W]</text>
<rect x="465" y="230" width="330" height="160" rx="8" class="tile"/><text x="630" y="268" class="bt">Letterbox 对齐</text><text x="630" y="301" class="tx">按比例缩放，四周补零</text><text x="630" y="333" class="shape">Hpad、Wpad % 256 = 0</text><text x="630" y="365" class="sm">保存 scale / pad / 原图尺寸</text>
<rect x="885" y="230" width="330" height="160" rx="8" class="tile"/><text x="1050" y="268" class="bt">Tile 切分</text><text x="1050" y="301" class="tx">无重叠，按行优先展开</text><text x="1050" y="333" class="shape">[N,3,256,256]</text><text x="1050" y="365" class="sm">每块保存 row、col、top、left</text>
<rect x="1305" y="230" width="360" height="160" rx="8" class="input"/><text x="1485" y="268" class="bt">Tile DataLoader</text><text x="1485" y="301" class="tx">原图划分后再展开 Tile</text><text x="1485" y="333" class="shape">image [B,3,256,256]</text><text x="1485" y="365" class="shape">mask [B,1,256,256]</text>
<rect x="1755" y="230" width="525" height="160" rx="8" class="note"/><text x="2017" y="270" class="bt">坐标元数据不进入模型</text><text x="2017" y="305" class="tx">Tile 坐标仅由推理/后处理保存，便于 CUDA、ONNX、TensorRT 固定输入</text><text x="2017" y="340" class="tx">最终输出先回填 Letterbox 画布，再裁 Padding 并恢复原始尺寸</text>
<path d="M375 310H465" class="arrow"/><path d="M795 310H885" class="arrow"/><path d="M1215 310H1305" class="arrow"/>

<rect x="55" y="475" width="2290" height="380" rx="10" class="group"/><text x="82" y="513" class="section">B. 单个 256×256 Tile 的第一阶段：16×16 Patch Router</text><line x1="55" y1="533" x2="2345" y2="533" class="divider"/>
<rect x="90" y="600" width="300" height="180" rx="8" class="tile"/><text x="240" y="638" class="bt">Tile 输入</text><text x="240" y="672" class="shape">[B,3,256,256]</text><text x="240" y="706" class="tx">ImagePatchingRect</text><text x="240" y="738" class="tx">kernel / stride = 16</text><text x="240" y="766" class="shape">[B×256,3,16,16]</text>
<rect x="475" y="600" width="330" height="180" rx="8" class="feature"/><text x="640" y="638" class="bt">Patch CNN</text><text x="640" y="672" class="tx">逐 Patch Conv3×3 + BN + GELU</text><text x="640" y="706" class="shape">[B,256,64,16,16]</text><text x="640" y="738" class="tx">完整 16×16 Grid 跨块交互</text><text x="640" y="766" class="sm">CNN 空间均值用于融合</text>
<rect x="890" y="600" width="330" height="180" rx="8" class="feature"/><text x="1055" y="638" class="bt">28D 统计特征</text><text x="1055" y="672" class="tx">基础统计 + 四邻域差异</text><text x="1055" y="706" class="shape">[B×256,28]</text><text x="1055" y="738" class="tx">MLP → [B,256,256]</text><text x="1055" y="766" class="sm">统计计算保持 FP32</text>
<rect x="1305" y="600" width="330" height="180" rx="8" class="router"/><text x="1470" y="638" class="bt">Feature Fusion + Router</text><text x="1470" y="672" class="tx">CNN 64D + MLP 256D</text><text x="1470" y="706" class="shape">fused [B,256,256]</text><text x="1470" y="738" class="tx">256→192→2</text><text x="1470" y="766" class="shape">keep [B,256]</text>
<rect x="1755" y="600" width="525" height="180" rx="8" class="note"/><text x="2017" y="638" class="bt">第一阶段输出</text><text x="2017" y="672" class="tx">keep_probability ≥ threshold → Selected</text><text x="2017" y="706" class="tx">否则 → Remaining</text><text x="2017" y="740" class="shape">patch_targets [B,16,16] / [B,256]</text><text x="2017" y="766" class="sm">Patch 内任意前景即为 Keep 目标</text>
<path d="M390 690H475" class="arrow"/><path d="M805 690H890" class="arrow"/><path d="M1220 690H1305" class="arrow"/><path d="M1635 690H1755" class="purple"/>

<rect x="55" y="900" width="2290" height="320" rx="10" class="group"/><text x="82" y="938" class="section">C. 第二阶段：Selected / Remaining 都直接处理 16×16 Patch</text><line x1="55" y1="958" x2="2345" y2="958" class="divider"/>
<rect x="90" y="1015" width="500" height="150" rx="8" class="decoder"/><text x="340" y="1053" class="bt">Selected Decoder</text><text x="340" y="1086" class="tx">原始 selected Patch [M1,3,16,16]</text><text x="340" y="1118" class="tx">融合 context [M1,256] 条件化</text><text x="340" y="1150" class="shape">输出 [M1,1,16,16]</text>
<rect x="700" y="1015" width="500" height="150" rx="8" class="decoder"/><text x="950" y="1053" class="bt">Remaining Decoder</text><text x="950" y="1086" class="tx">fused feature [M2,256]</text><text x="950" y="1118" class="tx">Linear + 轻量 Conv Refinement</text><text x="950" y="1150" class="shape">输出 [M2,1,16,16]</text>
<rect x="1310" y="1015" width="420" height="150" rx="8" class="router"/><text x="1520" y="1053" class="bt">Patch Mask 融合</text><text x="1520" y="1086" class="tx">按 selected / remaining index 回填</text><text x="1520" y="1118" class="shape">[B,256,1,16,16]</text><text x="1520" y="1150" class="sm">空分支安全处理</text>
<rect x="1840" y="1015" width="440" height="150" rx="8" class="output"/><text x="2060" y="1053" class="bt">Tile 输出</text><text x="2060" y="1086" class="shape">mask_logits [B,1,256,256]</text><text x="2060" y="1118" class="tx">16×16 Patch 按网格重排</text><text x="2060" y="1150" class="sm">训练损失在 Tile 输出上计算</text>
<path d="M590 1090H700" class="pink"/><path d="M1200 1090H1310" class="purple"/><path d="M1730 1090H1840" class="arrow"/>

<rect x="55" y="1265" width="2290" height="170" rx="10" class="group"/><text x="82" y="1303" class="section">D. 大图推理回拼与部署边界</text><line x1="55" y1="1323" x2="2345" y2="1323" class="divider"/>
<rect x="100" y="1350" width="490" height="65" rx="8" class="tile"/><text x="345" y="1391" class="bt">N 个 Tile mask → 按 top / left 回填</text>
<rect x="735" y="1350" width="430" height="65" rx="8" class="output"/><text x="950" y="1391" class="bt">Letterbox 画布 [1,Hpad,Wpad]</text>
<rect x="1310" y="1350" width="430" height="65" rx="8" class="note"/><text x="1525" y="1391" class="bt">裁 Padding + 恢复 [1,H,W]</text>
<rect x="1885" y="1350" width="395" height="65" rx="8" class="router"/><text x="2082" y="1391" class="bt">ONNX/TRT：固定 [B,3,256,256]</text>
<path d="M590 1382H735" class="arrow"/><path d="M1165 1382H1310" class="arrow"/><path d="M1740 1382H1885" class="gold"/>
<text x="70" y="1475" class="subtitle">部署接口：forward_deploy(images) → mask_logits [B,1,256,256]、keep_logits [B,256,2]、keep_probs [B,256]；部署图使用全量 Patch 两分支计算后由 selected mask 张量融合，避免动态 Python 索引。</text>
</svg>
