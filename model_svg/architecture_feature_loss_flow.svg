<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1540" viewBox="0 0 2400 1540" role="img" aria-labelledby="title desc">
<title id="title">EeTF 当前架构、特征流与三阶段损失</title>
<desc id="desc">768乘768输入经12乘12非重叠Patch网格、跨块特征交互和多Batch动态路由，使用Selected与Remaining双分支重建整图边缘Logit。</desc>
<defs><style>
*{font-family:Arial,'Noto Sans CJK SC',sans-serif}.bg{fill:#f7f9fc}.title{font-size:34px;font-weight:700;fill:#172033}.sub{font-size:18px;fill:#526174}.sec{font-size:21px;font-weight:700;fill:#334155}.t{font-size:19px;font-weight:700;fill:#172033;text-anchor:middle}.x{font-size:16px;fill:#344257;text-anchor:middle}.s{font-size:14px;fill:#526174;text-anchor:middle}.g{fill:#fff;stroke:#d5dee9;stroke-width:1.5}.i{fill:#e7f5f2;stroke:#369a8d;stroke-width:2}.f{fill:#eaf3fb;stroke:#3979a9;stroke-width:2}.r{fill:#f2edfb;stroke:#7957ae;stroke-width:2}.d{fill:#fff4e7;stroke:#c77821;stroke-width:2}.o{fill:#eaf7e8;stroke:#4b9460;stroke-width:2}.y{fill:#fff0ef;stroke:#c45a52;stroke-width:2}.l{fill:#fff8e8;stroke:#bb8425;stroke-width:2}.z{fill:#fdecef;stroke:#b44b67;stroke-width:2.5}.a{fill:none;stroke:#397080;stroke-width:2.4;marker-end:url(#a)}.b{fill:none;stroke:#6c5797;stroke-width:2.4;marker-end:url(#p)}.q{fill:none;stroke:#c45a52;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#q)}.w{fill:none;stroke:#b87922;stroke-width:2.2;marker-end:url(#w)}.di{stroke:#d5dee9;stroke-width:1.5;stroke-dasharray:6 8}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#397080"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#6c5797"/></marker><marker id="q" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#c45a52"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#b87922"/></marker></defs>
<rect class="bg" width="2400" height="1540"/><text x="70" y="60" class="title">EeTF：工业稀疏边缘分割模型</text><text x="70" y="92" class="sub">768 × 768 ｜ 64 × 64 非重叠 Patch ｜ 12 × 12 Grid ｜ 多 Batch 动态阈值路由</text>
<rect x="50" y="125" width="2300" height="755" rx="8" class="g"/><text x="78" y="160" class="sec">前向特征流</text><line x1="50" y1="180" x2="2350" y2="180" class="di"/>
<rect x="80" y="300" width="180" height="105" rx="7" class="i"/><text x="170" y="338" class="t">输入图像</text><text x="170" y="367" class="x">images</text><text x="170" y="390" class="s">[B,3,768,768]</text>
<rect x="330" y="275" width="205" height="155" rx="7" class="i"/><text x="432" y="312" class="t">ImagePatchingRect</text><text x="432" y="342" class="x">unfold 无重叠切块</text><text x="432" y="370" class="s">64 × 64，Grid = 12 × 12</text><text x="432" y="398" class="s">[B×144,3,64,64]</text><path d="M260 352H330" class="a"/>
<rect x="600" y="215" width="255" height="175" rx="7" class="f"/><text x="727" y="252" class="t">CNNBase</text><text x="727" y="281" class="x">Patch 内 CNN</text><text x="727" y="309" class="x">跨块 DWConv + GAP</text><text x="727" y="337" class="x">Patch Grid Conv + Channel Gate</text><text x="727" y="365" class="s">[B,144,64,64,64]</text>
<rect x="600" y="485" width="255" height="165" rx="7" class="f"/><text x="727" y="522" class="t">BlockFeatureExtractor</text><text x="727" y="552" class="x">结构 / std / GLCM / 熵</text><text x="727" y="581" class="s">4 + 16 + 8 = 28D</text><text x="727" y="610" class="s">FP32，replicate padding</text><text x="727" y="635" class="s">[B×144,28]</text>
<rect x="920" y="485" width="190" height="165" rx="7" class="f"/><text x="1015" y="522" class="t">MLPBase</text><text x="1015" y="552" class="x">28→32→64→128</text><text x="1015" y="580" class="x">→256→512→768</text><text x="1015" y="612" class="s">[B,144,768]</text>
<path d="M535 330H600" class="a"/><path d="M535 380V565H600" class="a"/><path d="M855 565H920" class="a"/>
<rect x="1180" y="300" width="230" height="155" rx="7" class="f"/><text x="1295" y="338" class="t">FeatureFusion</text><text x="1295" y="368" class="x">CNN 空间均值池化</text><text x="1295" y="397" class="x">64→768，与 MLP 相加</text><text x="1295" y="426" class="s">fused [B,144,768]</text><path d="M855 300H1180" class="a"/><path d="M1110 565H1150V420H1180" class="a"/>
<rect x="1475" y="245" width="255" height="285" rx="7" class="r"/><text x="1602" y="282" class="t">TokenSelector / Router</text><text x="1602" y="312" class="x">LayerNorm → 768→192→2</text><text x="1602" y="342" class="s">keep_logits [B,144,2]</text><text x="1602" y="370" class="s">keep_probs [B,144]</text><text x="1602" y="405" class="x">p ≥ threshold → selected</text><text x="1602" y="433" class="x">p &lt; threshold → remaining</text><text x="1602" y="466" class="s">每个样本独立的动态数量</text><text x="1602" y="496" class="s">packed features + indices 列表</text><path d="M1410 375H1475" class="a"/>
<rect x="1800" y="205" width="245" height="185" rx="7" class="r"/><text x="1922" y="243" class="t">Selected Packing</text><text x="1922" y="273" class="x">gather 原始 Patch 与 fused</text><text x="1922" y="302" class="s">selected_patches [M1,3,64,64]</text><text x="1922" y="330" class="s">selected_features [M1,768]</text><text x="1922" y="360" class="s">M1 = Σ N1(b)</text><path d="M1730 330H1800" class="b"/>
<rect x="1800" y="490" width="245" height="130" rx="7" class="r"/><text x="1922" y="528" class="t">Remaining Packing</text><text x="1922" y="558" class="x">gather fused features</text><text x="1922" y="588" class="s">remaining_features [M2,768]</text><text x="1922" y="612" class="s">M2 = Σ N2(b)</text><path d="M1730 455H1765V550H1800" class="b"/>
<rect x="2110" y="205" width="210" height="185" rx="7" class="d"/><text x="2215" y="243" class="t">Selected Decoder</text><text x="2215" y="273" class="x">原始 Patch CNN</text><text x="2215" y="302" class="x">768→128 context 广播</text><text x="2215" y="331" class="x">块内 Transformer</text><text x="2215" y="360" class="s">[M1,1,64,64]</text><path d="M2045 295H2110" class="a"/>
<rect x="2110" y="490" width="210" height="130" rx="7" class="d"/><text x="2215" y="528" class="t">Remaining Decoder</text><text x="2215" y="558" class="x">768→32×32，上采样</text><text x="2215" y="588" class="s">[M2,1,64,64]</text><path d="M2045 550H2110" class="a"/>
<path d="M535 400V745H2075V345H2110" class="b"/><text x="1265" y="730" class="s">selected_indices 在每个样本内映射回原始 Patch</text>
<rect x="1110" y="735" width="330" height="100" rx="7" class="o"/><text x="1275" y="772" class="t">批量动态回填</text><text x="1275" y="802" class="x">selected + remaining 按 sample / Patch index 回填</text><text x="1275" y="825" class="s">mask_logits [B,1,768,768]</text><path d="M2215 390V680H1440V760" class="a"/><path d="M2215 620V700H1440V800" class="a"/>
<rect x="50" y="930" width="2300" height="540" rx="8" class="g"/><text x="78" y="965" class="sec">标签、阶段损失与训练状态</text><line x1="50" y1="985" x2="2350" y2="985" class="di"/>
<rect x="90" y="1075" width="220" height="115" rx="7" class="y"/><text x="200" y="1113" class="t">edge mask</text><text x="200" y="1143" class="x">8-bit 灰度软标签 /255</text><text x="200" y="1172" class="s">[B,1,768,768]</text>
<rect x="380" y="1010" width="390" height="205" rx="7" class="l"/><text x="575" y="1047" class="t">Segmentation Structure Loss</text><text x="575" y="1078" class="x">L_pixel = Weighted BCE + Dice</text><text x="575" y="1117" class="x">L_seg = L_pixel + λclDice × Soft-clDice</text><text x="575" y="1155" class="x">完整回填 mask 的骨架拓扑约束</text><text x="575" y="1195" class="s">不使用 Local Affinity 或 Patch Seam</text><path d="M310 1132H380" class="q"/><path d="M1275 835V990H575V1010" class="q"/>
<rect x="380" y="1265" width="300" height="130" rx="7" class="y"/><text x="530" y="1302" class="t">pool_patch_targets</text><text x="530" y="1332" class="x">label &gt; 0 的硬占用判断</text><text x="530" y="1362" class="s">patch_targets [B,144]</text><path d="M200 1190V1330H380" class="q"/>
<rect x="790" y="1265" width="300" height="130" rx="7" class="l"/><text x="940" y="1302" class="t">Router Loss</text><text x="940" y="1332" class="x">Weighted CE + 相邻关系</text><text x="940" y="1355" class="x">+ 结构边界 + 孤立结构</text><text x="940" y="1380" class="s">Patch Grid 连续概率监督</text><path d="M680 1330H790" class="q"/><path d="M1602 530V1230H940V1265" class="q"/>
<rect x="1190" y="1045" width="430" height="220" rx="7" class="z"/><text x="1405" y="1085" class="t">三阶段训练调度</text><text x="1405" y="1120" class="x">1 routing：CNN / MLP / 融合 / Router</text><text x="1405" y="1153" class="x">仅 route_loss，不执行解码</text><text x="1405" y="1190" class="x">2 segmentation：冻结路由模块为 eval</text><text x="1405" y="1223" class="x">仅 Decoder，优化 L_seg</text><text x="1405" y="1255" class="x">3 finetune：全部模块，Router 使用低 LR</text>
<rect x="1740" y="1045" width="510" height="220" rx="7" class="z"/><text x="1995" y="1085" class="t">当前总损失</text><text x="1995" y="1125" class="x">routing：L = router_loss</text><text x="1995" y="1160" class="x">segmentation：L = L_seg</text><text x="1995" y="1195" class="x">finetune：L = L_seg</text><text x="1995" y="1230" class="x">+ router_weight × router_loss</text><text x="1995" y="1260" class="s">阈值索引不将像素损失反传到 Router</text><path d="M770 1105H1740" class="w"/><path d="M1090 1330H1660V1175H1740" class="w"/><path d="M1620 1155H1740" class="w"/>
<line x1="90" y1="1430" x2="125" y2="1430" class="a"/><text x="230" y="1435" class="s">实线：图像 / 特征 / 预测</text><line x1="510" y1="1430" x2="545" y2="1430" class="q"/><text x="700" y="1435" class="s">红色虚线：标签监督</text><line x1="930" y1="1430" x2="965" y2="1430" class="w"/><text x="1130" y="1435" class="s">橙色：损失聚合</text>
</svg>
