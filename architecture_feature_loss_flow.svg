<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1550" viewBox="0 0 2400 1550" role="img" aria-labelledby="title desc">
<title id="title">EeTF 当前架构、特征流与三阶段损失</title><desc id="desc">概率阈值动态选块、双分支稀疏边缘分割和三阶段训练损失。</desc>
<defs><style>
*{font-family:Arial,'Noto Sans CJK SC',sans-serif}.bg{fill:#f8fafc}.title{font-size:34px;font-weight:700;fill:#172033}.sub{font-size:18px;fill:#526174}.sec{font-size:20px;font-weight:700;fill:#334155}.t{font-size:19px;font-weight:700;fill:#172033;text-anchor:middle}.x{font-size:16px;fill:#344257;text-anchor:middle}.s{font-size:14px;fill:#526174;text-anchor:middle}.fl{font-size:14px;font-weight:700;fill:#245f73;text-anchor:middle}.ll{font-size:14px;font-weight:700;fill:#a33c2b;text-anchor:middle}.g{fill:#fff;stroke:#d5dee9;stroke-width:1.5}.i{fill:#e7f5f2;stroke:#369a8d;stroke-width:2}.f{fill:#eaf3fb;stroke:#3979a9;stroke-width:2}.r{fill:#f2edfb;stroke:#7957ae;stroke-width:2}.d{fill:#fff4e7;stroke:#c77821;stroke-width:2}.o{fill:#eaf7e8;stroke:#4b9460;stroke-width:2}.y{fill:#fff0ef;stroke:#c45a52;stroke-width:2}.l{fill:#fff8e8;stroke:#bb8425;stroke-width:2}.z{fill:#fdecef;stroke:#b44b67;stroke-width:2.5}.a{fill:none;stroke:#397080;stroke-width:2.4;marker-end:url(#a)}.b{fill:none;stroke:#6c5797;stroke-width:2.4;marker-end:url(#p)}.q{fill:none;stroke:#c45a52;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#q)}.w{fill:none;stroke:#b87922;stroke-width:2.2;marker-end:url(#w)}.di{stroke:#d5dee9;stroke-width:1.5;stroke-dasharray:6 8}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#397080"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#6c5797"/></marker><marker id="q" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#c45a52"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#b87922"/></marker></defs>
<rect class="bg" width="2400" height="1550"/><text x="70" y="60" class="title">EeTF：稀疏边缘分割模型（当前代码）</text><text x="70" y="92" class="sub">完整 28D 统计特征 ｜ 概率阈值选块 ｜ B=1 ｜ 三阶段训练</text>
<rect x="50" y="125" width="2300" height="760" rx="8" class="g"/><text x="78" y="160" class="sec">前向特征流</text><line x1="50" y1="180" x2="2350" y2="180" class="di"/>
<rect x="80" y="300" width="180" height="105" rx="7" class="i"/><text x="170" y="338" class="t">输入图像</text><text x="170" y="367" class="x">images</text><text x="170" y="390" class="s">[B,3,H,W]</text>
<rect x="330" y="275" width="205" height="155" rx="7" class="i"/><text x="432" y="312" class="t">ImagePatchingRect</text><text x="432" y="342" class="x">unfold 无重叠切块</text><text x="432" y="370" class="s">Patch = 64 × 32</text><text x="432" y="398" class="s">[B×N,3,64,32]</text><path d="M260 352H330" class="a"/>
<rect x="600" y="215" width="230" height="150" rx="7" class="f"/><text x="715" y="252" class="t">CNNBase</text><text x="715" y="282" class="x">局部视觉特征</text><text x="715" y="311" class="s">末端 [B×N,64,16,8]</text><text x="715" y="338" class="s">展平 [B,N,8192]</text>
<rect x="600" y="475" width="230" height="175" rx="7" class="f"/><text x="715" y="512" class="t">BlockFeatureExtractor</text><text x="715" y="542" class="x">结构 / std / GLCM / 熵</text><text x="715" y="572" class="s">4 + 16 + 8 = 28D</text><text x="715" y="600" class="s">FP32，replicate padding</text><text x="715" y="628" class="s">[B×N,28]</text>
<rect x="890" y="475" width="190" height="175" rx="7" class="f"/><text x="985" y="512" class="t">MLPBase</text><text x="985" y="542" class="x">28→32→64→128</text><text x="985" y="570" class="x">→256→512→768</text><text x="985" y="602" class="s">[B,N,768]</text>
<path d="M535 330H600" class="a"/><path d="M535 380V560H600" class="a"/><path d="M830 560H890" class="a"/>
<rect x="1150" y="300" width="220" height="155" rx="7" class="f"/><text x="1260" y="338" class="t">FeatureFusion</text><text x="1260" y="368" class="x">CNN 投影 + MLP 相加</text><text x="1260" y="398" class="s">8192→768</text><text x="1260" y="426" class="s">fused [B,N,768]</text><path d="M830 290H1150" class="a"/><path d="M1080 560H1120V420H1150" class="a"/>
<rect x="1435" y="245" width="255" height="285" rx="7" class="r"/><text x="1562" y="282" class="t">TokenSelector / Router</text><text x="1562" y="312" class="x">768→192→2</text><text x="1562" y="342" class="s">keep_logits [B,N,2]</text><text x="1562" y="370" class="s">keep_probs [B,N]</text><text x="1562" y="405" class="x">p ≥ threshold → selected</text><text x="1562" y="433" class="x">p &lt; threshold → remaining</text><text x="1562" y="466" class="s">数量不固定，支持空分支</text><text x="1562" y="496" class="s">indices 与 coords 动态生成</text><path d="M1370 375H1435" class="a"/>
<rect x="1760" y="210" width="250" height="170" rx="7" class="r"/><text x="1885" y="248" class="t">Selected Attention</text><text x="1885" y="278" class="x">LayerNorm + 2D-RoPE</text><text x="1885" y="308" class="s">12 heads × 64 dims</text><text x="1885" y="338" class="s">[B,N1,768]</text><path d="M1690 330H1760" class="b"/><text x="1725" y="315" class="fl">selected</text>
<rect x="1760" y="490" width="250" height="120" rx="7" class="r"/><text x="1885" y="528" class="t">Remaining Features</text><text x="1885" y="558" class="x">按 remaining_indices gather</text><text x="1885" y="588" class="s">[B,N2,768]</text><path d="M1690 455H1725V550H1760" class="b"/><text x="1725" y="535" class="fl">remaining</text>
<rect x="2080" y="210" width="220" height="170" rx="7" class="d"/><text x="2190" y="248" class="t">Selected Decoder</text><text x="2190" y="278" class="x">CNN + context(768→128)</text><text x="2190" y="308" class="x">块内 Transformer</text><text x="2190" y="338" class="s">[B×N1,1,64,32]</text><path d="M2010 295H2080" class="a"/>
<rect x="2080" y="490" width="220" height="120" rx="7" class="d"/><text x="2190" y="528" class="t">Remaining Decoder</text><text x="2190" y="558" class="x">768→512→32×16</text><text x="2190" y="588" class="s">上采样 [B×N2,1,64,32]</text><path d="M2010 550H2080" class="a"/>
<path d="M535 400V745H2050V345H2080" class="b"/><text x="1280" y="730" class="fl">selected 原始 Patch gather</text>
<rect x="1110" y="735" width="300" height="100" rx="7" class="o"/><text x="1260" y="772" class="t">merge_patch_logits</text><text x="1260" y="802" class="x">按原始索引回填 selected + remaining</text><text x="1260" y="825" class="s">mask_logits [B,1,H,W]</text><path d="M2190 380V680H1410V760" class="a"/><path d="M2190 610V700H1410V800" class="a"/>
<rect x="50" y="935" width="2300" height="535" rx="8" class="g"/><text x="78" y="970" class="sec">标签、阶段损失与训练状态</text><line x1="50" y1="990" x2="2350" y2="990" class="di"/>
<rect x="90" y="1080" width="220" height="115" rx="7" class="y"/><text x="200" y="1118" class="t">edge mask</text><text x="200" y="1148" class="x">8-bit 灰度软标签 /255</text><text x="200" y="1177" class="s">[B,1,H,W]</text>
<rect x="380" y="1015" width="380" height="205" rx="7" class="l"/><text x="570" y="1052" class="t">Segmentation Structure Loss</text><text x="570" y="1083" class="x">L_pixel = Weighted BCE + Dice</text><text x="570" y="1122" class="x">L_seg = L_pixel + 0.2 × Soft-clDice</text><text x="570" y="1160" class="x">骨架拓扑约束</text><text x="570" y="1200" class="s">完整回填 mask 上计算；已移除 Affinity / Seam</text><path d="M310 1135H380" class="q"/><path d="M1260 835V995H570V1015" class="q"/>
<rect x="380" y="1270" width="300" height="130" rx="7" class="y"/><text x="530" y="1307" class="t">pool_patch_targets</text><text x="530" y="1337" class="x">label &gt; 0 的硬占用判断</text><text x="530" y="1367" class="s">patch_targets [B,N]</text><path d="M200 1195V1335H380" class="q"/>
<rect x="790" y="1270" width="300" height="130" rx="7" class="l"/><text x="940" y="1307" class="t">Router Loss</text><text x="940" y="1337" class="x">Weighted CE + 相邻关系</text><text x="940" y="1360" class="x">+ 结构边界 + 孤立结构</text><text x="940" y="1385" class="s">keep_probs / patch_targets 网格监督</text><path d="M680 1335H790" class="q"/><path d="M1560 530V1235H940V1270" class="q"/>
<rect x="1190" y="1050" width="430" height="220" rx="7" class="z"/><text x="1405" y="1090" class="t">三阶段训练调度</text><text x="1405" y="1125" class="x">1 routing：仅 Router/CNN/MLP/融合</text><text x="1405" y="1158" class="x">仅 route_loss，不执行解码</text><text x="1405" y="1195" class="x">2 segmentation：冻结选块模块</text><text x="1405" y="1228" class="x">L_seg（pixel + Soft-clDice）</text><text x="1405" y="1260" class="x">3 finetune：全量联合，Router 低 LR</text>
<rect x="1740" y="1050" width="510" height="220" rx="7" class="z"/><text x="1995" y="1090" class="t">当前总损失</text><text x="1995" y="1130" class="x">routing：L = router_loss</text><text x="1995" y="1165" class="x">segmentation：L = segmentation_loss</text><text x="1995" y="1200" class="x">finetune：L = segmentation_loss</text><text x="1995" y="1235" class="x">+ router_weight × router_loss</text><text x="1995" y="1265" class="s">不再使用 keep-ratio / ratio_loss</text><text x="1995" y="1290" class="s">结构项仅惩罚标签不一致孤立预测</text><path d="M680 1110H1740" class="w"/><path d="M1090 1335H1660V1180H1740" class="w"/><path d="M1620 1160H1740" class="w"/>
<line x1="90" y1="1430" x2="125" y2="1430" class="a"/><text x="220" y="1435" class="s">实线：图像 / 特征 / 预测</text><line x1="510" y1="1430" x2="545" y2="1430" class="q"/><text x="680" y="1435" class="s">红色虚线：标签监督</text><line x1="930" y1="1430" x2="965" y2="1430" class="w"/><text x="1110" y="1435" class="s">橙色：损失聚合</text>
</svg>