<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">EeTF 模型整体结构图：特征流与损失计算</title>
  <desc id="desc">展示图像和标签输入、Patch 切分、CNN 与统计特征双路编码、特征融合、DynamicViT 路由、selected 和 remaining 双分支解码、掩码回填，以及像素、路由和保留率损失。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 18px; fill: #526174; }
      .section { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 19px; font-weight: 700; fill: #334155; letter-spacing: 0; }
      .box-title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 20px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .box-text { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 16px; fill: #344257; text-anchor: middle; }
      .small { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 14px; fill: #526174; text-anchor: middle; }
      .flow-label { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 14px; font-weight: 700; fill: #245f73; text-anchor: middle; }
      .loss-label { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 14px; font-weight: 700; fill: #a33c2b; text-anchor: middle; }
      .group { fill: #ffffff; stroke: #d5dee9; stroke-width: 1.5; }
      .input { fill: #e7f5f2; stroke: #369a8d; stroke-width: 2; }
      .feature { fill: #eaf3fb; stroke: #3979a9; stroke-width: 2; }
      .route { fill: #f2edfb; stroke: #7957ae; stroke-width: 2; }
      .decode { fill: #fff4e7; stroke: #c77821; stroke-width: 2; }
      .output { fill: #eaf7e8; stroke: #4b9460; stroke-width: 2; }
      .label { fill: #fff0ef; stroke: #c45a52; stroke-width: 2; }
      .loss { fill: #fff8e8; stroke: #bb8425; stroke-width: 2; }
      .total { fill: #fdecef; stroke: #b44b67; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #397080; stroke-width: 2.4; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #6c5797; stroke-width: 2.4; marker-end: url(#arrowPurple); }
      .supervise { fill: none; stroke: #c45a52; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
      .lossflow { fill: none; stroke: #b87922; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .divider { stroke: #d5dee9; stroke-width: 1.5; stroke-dasharray: 6 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#397080"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6c5797"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c45a52"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b87922"/></marker>
  </defs>

  <rect class="bg" width="2400" height="1600"/>
  <text x="80" y="66" class="title">EeTF：稀疏边缘分割模型整体结构</text>
  <text x="80" y="98" class="subtitle">仅包含模块、张量维度、特征流与损失计算 ｜ Patch size = 64 x 32 ｜ B = 1</text>

  <rect x="60" y="135" width="2240" height="690" rx="8" class="group"/>
  <text x="88" y="170" class="section">前向特征流</text>
  <line x1="60" y1="192" x2="2300" y2="192" class="divider"/>

  <rect x="90" y="285" width="175" height="108" rx="7" class="input"/>
  <text x="177" y="322" class="box-title">输入图像</text>
  <text x="177" y="352" class="box-text">images</text>
  <text x="177" y="377" class="small">[B, 3, H, W]</text>

  <rect x="325" y="270" width="195" height="138" rx="7" class="input"/>
  <text x="422" y="307" class="box-title">ImagePatchingRect</text>
  <text x="422" y="337" class="box-text">非重叠 Patch 切分</text>
  <text x="422" y="365" class="small">Patch: 64 x 32</text>
  <text x="422" y="388" class="small">[B*N, 3, 64, 32]</text>

  <path d="M265 339 H325" class="arrow"/>
  <text x="295" y="326" class="flow-label">图像</text>

  <rect x="585" y="224" width="220" height="148" rx="7" class="feature"/>
  <text x="695" y="259" class="box-title">CNNBase</text>
  <text x="695" y="288" class="box-text">5-stage CNN</text>
  <text x="695" y="315" class="small">64 x 16 x 8 = 8192</text>
  <text x="695" y="340" class="small">[B, N, 8192]</text>

  <rect x="585" y="442" width="220" height="158" rx="7" class="feature"/>
  <text x="695" y="477" class="box-title">BlockFeatureExtractor</text>
  <text x="695" y="506" class="box-text">结构 / 标准差 / GLCM / 熵</text>
  <text x="695" y="533" class="small">当前 4D 统计量，零填充至 28D</text>
  <text x="695" y="558" class="small">[B*N, 28]</text>

  <rect x="875" y="442" width="180" height="158" rx="7" class="feature"/>
  <text x="965" y="477" class="box-title">MLPBase</text>
  <text x="965" y="506" class="box-text">28 -> 32 -> ... -> 768</text>
  <text x="965" y="535" class="small">统计 Token 投影</text>
  <text x="965" y="560" class="small">[B, N, 768]</text>

  <path d="M520 320 H585" class="arrow"/>
  <path d="M520 357 V521 H585" class="arrow"/>
  <path d="M805 521 H875" class="arrow"/>

  <rect x="1120" y="300" width="210" height="152" rx="7" class="feature"/>
  <text x="1225" y="337" class="box-title">FeatureFusion</text>
  <text x="1225" y="366" class="box-text">CNN 投影 + MLP 特征相加</text>
  <text x="1225" y="394" class="small">8192 -> 768</text>
  <text x="1225" y="419" class="small">fused: [B, N, 768]</text>

  <path d="M805 298 H1120" class="arrow"/>
  <path d="M1055 521 H1085 V417 H1120" class="arrow"/>

  <rect x="1395" y="250" width="240" height="250" rx="7" class="route"/>
  <text x="1515" y="287" class="box-title">DynamicViT TokenSelector</text>
  <text x="1515" y="317" class="box-text">Router: 768 -> 192 -> 2</text>
  <text x="1515" y="345" class="small">keep_logits: [B, N, 2]</text>
  <text x="1515" y="370" class="small">keep_probs: [B, N]</text>
  <text x="1515" y="397" class="small">Top-K: K = max(1, floor(N * r))</text>
  <text x="1515" y="424" class="small">selected_indices [B, K]</text>
  <text x="1515" y="449" class="small">remaining_indices [B, N-K]</text>
  <text x="1515" y="477" class="small">Patch 中心坐标: [B, N, 2]</text>

  <path d="M1330 376 H1395" class="arrow"/>

  <rect x="1705" y="220" width="230" height="142" rx="7" class="route"/>
  <text x="1820" y="257" class="box-title">Selected Token Attention</text>
  <text x="1820" y="287" class="box-text">LayerNorm + 2D-RoPE Attention</text>
  <text x="1820" y="315" class="small">12 heads x 64 dims</text>
  <text x="1820" y="340" class="small">[B, K, 768]</text>

  <rect x="1705" y="456" width="230" height="112" rx="7" class="route"/>
  <text x="1820" y="493" class="box-title">Remaining Features</text>
  <text x="1820" y="523" class="box-text">按 remaining_indices Gather</text>
  <text x="1820" y="548" class="small">[B, N-K, 768]</text>

  <path d="M1635 322 H1705" class="branch"/>
  <text x="1670" y="307" class="flow-label">selected</text>
  <path d="M1635 433 H1668 V512 H1705" class="branch"/>
  <text x="1670" y="495" class="flow-label">remaining</text>

  <rect x="2005" y="220" width="230" height="142" rx="7" class="decode"/>
  <text x="2120" y="257" class="box-title">SelectedPatchDecoder</text>
  <text x="2120" y="287" class="box-text">原始 Patch + 局部 Transformer</text>
  <text x="2120" y="315" class="small">细粒度解码</text>
  <text x="2120" y="340" class="small">[B*K, 1, 64, 32]</text>

  <rect x="2005" y="456" width="230" height="112" rx="7" class="decode"/>
  <text x="2120" y="493" class="box-title">RemainingPatchDecoder</text>
  <text x="2120" y="523" class="box-text">768 -> 512 -> 32 x 16 -> 上采样</text>
  <text x="2120" y="548" class="small">[B, N-K, 1, 64, 32]</text>

  <path d="M1935 291 H2005" class="arrow"/>
  <path d="M520 360 V640 H1970 V331 H2005" class="branch"/>
  <text x="1040" y="630" class="flow-label">selected_indices Gather 原始 Patch</text>
  <path d="M1935 512 H2005" class="arrow"/>

  <rect x="960" y="675" width="310" height="106" rx="7" class="output"/>
  <text x="1115" y="712" class="box-title">按原始 Patch 索引回填与合并</text>
  <text x="1115" y="741" class="box-text">selected + remaining mask logits</text>
  <text x="1115" y="766" class="small">[B, 1, H, W]</text>

  <path d="M2120 362 V635 H1270 V710" class="arrow"/>
  <path d="M2120 568 V655 H1270 V735" class="arrow"/>

  <rect x="1385" y="675" width="250" height="106" rx="7" class="output"/>
  <text x="1510" y="712" class="box-title">mask_logits</text>
  <text x="1510" y="741" class="box-text">完整像素级边缘预测</text>
  <text x="1510" y="766" class="small">[B, 1, H, W]</text>
  <path d="M1270 728 H1385" class="arrow"/>

  <rect x="60" y="875" width="2240" height="625" rx="8" class="group"/>
  <text x="88" y="910" class="section">监督标签与损失计算（当前三阶段训练）</text>
  <line x1="60" y1="932" x2="2300" y2="932" class="divider"/>

  <rect x="90" y="985" width="220" height="110" rx="7" class="label"/>
  <text x="200" y="1022" class="box-title">边缘标签 masks</text>
  <text x="200" y="1052" class="box-text">8-bit 灰度软标签 / 255</text>
  <text x="200" y="1078" class="small">[B, 1, H, W], [0, 1]</text>

  <rect x="390" y="975" width="280" height="130" rx="7" class="loss"/>
  <text x="530" y="1012" class="box-title">Pixel Loss</text>
  <text x="530" y="1042" class="box-text">Foreground-weighted BCE</text>
  <text x="530" y="1068" class="box-text">+ Dice Loss（软目标）</text>
  <text x="530" y="1093" class="small">L_pixel</text>
  <path d="M310 1040 H390" class="supervise"/>
  <path d="M1510 781 V850 H530 V975" class="supervise"/>
  <text x="1020" y="840" class="loss-label">mask_logits [B, 1, H, W]</text>

  <rect x="90" y="1190" width="220" height="125" rx="7" class="label"/>
  <text x="200" y="1227" class="box-title">Patch 硬标签</text>
  <text x="200" y="1257" class="box-text">pool_patch_targets</text>
  <text x="200" y="1283" class="box-text">Patch 内存在 label &gt; 0</text>
  <text x="200" y="1307" class="small">y [B, N]，Drop / Keep</text>
  <path d="M200 1095 V1190" class="supervise"/>

  <rect x="385" y="1155" width="245" height="130" rx="7" class="loss"/>
  <text x="507" y="1192" class="box-title">Weighted CE</text>
  <text x="507" y="1222" class="box-text">类别加权二分类</text>
  <text x="507" y="1250" class="small">keep_logits vs y</text>
  <text x="507" y="1275" class="small">L_CE</text>

  <rect x="675" y="1155" width="245" height="130" rx="7" class="loss"/>
  <text x="797" y="1192" class="box-title">Pairwise Loss</text>
  <text x="797" y="1222" class="box-text">同标签概率接近</text>
  <text x="797" y="1248" class="box-text">异标签 margin 分离</text>
  <text x="797" y="1275" class="small">L_pair，四邻域</text>

  <rect x="965" y="1155" width="245" height="130" rx="7" class="loss"/>
  <text x="1087" y="1192" class="box-title">Boundary Loss</text>
  <text x="1087" y="1222" class="box-text">Keep: p ≥ τ + margin</text>
  <text x="1087" y="1248" class="box-text">Drop: p ≤ τ - margin</text>
  <text x="1087" y="1275" class="small">L_boundary</text>

  <rect x="1255" y="1155" width="270" height="130" rx="7" class="loss"/>
  <text x="1390" y="1192" class="box-title">Morphology Loss</text>
  <text x="1390" y="1222" class="box-text">仅预测与标签不一致</text>
  <text x="1390" y="1248" class="box-text">且四邻域中孤立时惩罚</text>
  <text x="1390" y="1275" class="small">L_morphology</text>

  <path d="M310 1250 H350 V1220 H385" class="supervise"/>
  <path d="M310 1250 H650 V1220 H675" class="supervise"/>
  <path d="M310 1270 H940 V1220 H965" class="supervise"/>
  <path d="M310 1290 H1230 V1220 H1255" class="supervise"/>
  <path d="M1515 500 V1115 H507 V1155" class="supervise"/>
  <text x="1120" y="1105" class="loss-label">keep_logits → softmax → keep_probs p [B, N]；Patch 网格 Hₚ × Wₚ</text>

  <rect x="385" y="1340" width="1140" height="115" rx="7" class="total"/>
  <text x="955" y="1377" class="box-title">第一阶段 Router 结构监督</text>
  <text x="955" y="1408" class="box-text">L_router = L_CE + λ_pair L_pair + λ_boundary L_boundary + λ_morphology L_morphology</text>
  <text x="955" y="1436" class="small">默认权重：λ_pair = 0.1，λ_boundary = 0.2，λ_morphology = 0.1；无 keep-ratio / ratio_loss</text>
  <path d="M507 1285 V1340" class="lossflow"/><path d="M797 1285 V1320 H850 V1340" class="lossflow"/>
  <path d="M1087 1285 V1320 H1060 V1340" class="lossflow"/><path d="M1390 1285 V1340" class="lossflow"/>

  <rect x="1615" y="975" width="590" height="300" rx="7" class="total"/>
  <text x="1910" y="1015" class="box-title">Stage-aware Total Loss</text>
  <text x="1910" y="1055" class="box-text">Stage 1 · routing</text>
  <text x="1910" y="1085" class="box-text">L_total = L_router（不执行像素解码）</text>
  <text x="1910" y="1130" class="box-text">Stage 2 · segmentation</text>
  <text x="1910" y="1160" class="box-text">L_total = L_pixel（Router 冻结并保持 eval）</text>
  <text x="1910" y="1205" class="box-text">Stage 3 · finetune</text>
  <text x="1910" y="1235" class="box-text">L_total = L_pixel + router_weight × L_router</text>
  <text x="1910" y="1262" class="small">Router 使用较低学习率联合微调</text>
  <path d="M670 1040 H1615" class="lossflow"/>
  <path d="M1525 1397 H1570 V1180 H1615" class="lossflow"/>

  <line x1="90" y1="1545" x2="125" y2="1545" class="arrow"/>
  <text x="215" y="1550" class="small">实线：图像 / 特征 / 预测流</text>
  <line x1="510" y1="1545" x2="545" y2="1545" class="supervise"/>
  <text x="665" y="1550" class="small">虚线：标签监督流</text>
  <line x1="930" y1="1545" x2="965" y2="1545" class="lossflow"/>
  <text x="1090" y="1550" class="small">橙色：损失聚合流</text>
</svg>
