<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1680" viewBox="0 0 2500 1680" role="img" aria-labelledby="title desc">
  <title id="title">EeTF Selected 分支详细特征流</title>
  <desc id="desc">展示 selected_indices 对原始 Patch 的 Gather、selected_coords 在 2D-RoPE 中的作用、768 维上下文与局部 CNN 特征融合，以及单通道二分类像素 Logit 的生成过程。</desc>
  <defs>
    <style>
      * { font-family: Arial, 'Noto Sans CJK SC', sans-serif; }
      .bg { fill:#f8fafc; }
      .group { fill:#fff; stroke:#d3dce8; stroke-width:1.8; }
      .input { fill:#e7f5f2; stroke:#2e8f83; stroke-width:2.2; }
      .index { fill:#f2edfb; stroke:#7452a8; stroke-width:2.2; }
      .global { fill:#e9f2fc; stroke:#3979a9; stroke-width:2.2; }
      .local { fill:#fff3e5; stroke:#c77821; stroke-width:2.2; }
      .fusion { fill:#fdf0f5; stroke:#b24e76; stroke-width:2.2; }
      .output { fill:#e8f7e8; stroke:#438c59; stroke-width:2.2; }
      .note { fill:#fffbea; stroke:#b58a28; stroke-width:1.8; }
      .title { font-size:36px; font-weight:700; fill:#172033; }
      .subtitle { font-size:18px; fill:#526174; }
      .section { font-size:21px; font-weight:700; fill:#334155; }
      .bt { font-size:20px; font-weight:700; fill:#172033; text-anchor:middle; }
      .tx { font-size:16px; fill:#344257; text-anchor:middle; }
      .sm { font-size:14px; fill:#526174; text-anchor:middle; }
      .shape { font-size:15px; font-weight:700; fill:#1f5f78; text-anchor:middle; }
      .label { font-size:14px; font-weight:700; fill:#315f72; text-anchor:middle; }
      .warn { font-size:16px; font-weight:700; fill:#8a5418; text-anchor:middle; }
      .arrow { fill:none; stroke:#397080; stroke-width:2.5; marker-end:url(#arrow); }
      .idxarrow { fill:none; stroke:#7452a8; stroke-width:2.5; marker-end:url(#purple); }
      .ctxarrow { fill:none; stroke:#b24e76; stroke-width:2.5; marker-end:url(#pink); }
      .dash { fill:none; stroke:#997125; stroke-width:2; stroke-dasharray:8 6; marker-end:url(#gold); }
      .divider { stroke:#d3dce8; stroke-width:1.5; stroke-dasharray:6 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#397080"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7452a8"/></marker>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b24e76"/></marker>
    <marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#997125"/></marker>
  </defs>

  <rect class="bg" width="2500" height="1680"/>
  <text x="70" y="62" class="title">Selected 分支：从动态选块到块内像素二分类</text>
  <text x="70" y="96" class="subtitle">当前代码真实数据流 ｜ Patch = 64×32 ｜ d_model = 768 ｜ B=1（图中保留 B 维符号）</text>

  <rect x="55" y="130" width="2390" height="425" rx="10" class="group"/>
  <text x="82" y="168" class="section">A. Router 输出三类信息：索引、坐标、融合 Token</text>
  <line x1="55" y1="188" x2="2445" y2="188" class="divider"/>

  <rect x="90" y="250" width="260" height="150" rx="8" class="input"/>
  <text x="220" y="287" class="bt">全部原始 Patch</text>
  <text x="220" y="319" class="tx">unfold 后按网格展平</text>
  <text x="220" y="350" class="shape">patches [B×N,3,64,32]</text>
  <text x="220" y="379" class="sm">当前 B=1</text>

  <rect x="440" y="230" width="300" height="190" rx="8" class="index"/>
  <text x="590" y="268" class="bt">selected_indices</text>
  <text x="590" y="301" class="shape">[B,N1]，整数索引</text>
  <text x="590" y="333" class="tx">来自 keep_probs ≥ threshold</text>
  <text x="590" y="363" class="tx">用于 Gather 原始 Patch</text>
  <text x="590" y="393" class="sm">不是二维坐标</text>

  <rect x="830" y="230" width="300" height="190" rx="8" class="index"/>
  <text x="980" y="268" class="bt">selected_coords</text>
  <text x="980" y="301" class="shape">[B,N1,2]</text>
  <text x="980" y="333" class="tx">每个选中块中心 (x,y)</text>
  <text x="980" y="363" class="tx">归一化到 [0,1]</text>
  <text x="980" y="393" class="sm">只用于 2D-RoPE，不用于取块</text>

  <rect x="1220" y="230" width="310" height="190" rx="8" class="global"/>
  <text x="1375" y="268" class="bt">selected_x</text>
  <text x="1375" y="301" class="shape">[B,N1,768]</text>
  <text x="1375" y="333" class="tx">从 fused_features [B,N,768]</text>
  <text x="1375" y="363" class="tx">按 selected_indices Gather</text>
  <text x="1375" y="393" class="sm">CNN + 28D统计 MLP 融合 Token</text>

  <rect x="1640" y="230" width="710" height="190" rx="8" class="note"/>
  <text x="1995" y="271" class="warn">关键区别</text>
  <text x="1995" y="310" class="tx">selected_indices [B,N1]：回答“选择第几个 Patch”</text>
  <text x="1995" y="345" class="tx">selected_coords [B,N1,2]：回答“该 Patch 位于图像什么位置”</text>
  <text x="1995" y="382" class="tx">二者由同一 selected mask 得到，但用途不同</text>

  <path d="M350 325 H440" class="idxarrow"/>
  <text x="395" y="309" class="label">索引取块</text>
  <path d="M740 325 H790 V470 H220 V400" class="idxarrow"/>
  <text x="515" y="459" class="label">先 reshape [B,N,3,64,32]，再 gather dim=1</text>

  <rect x="55" y="595" width="2390" height="430" rx="10" class="group"/>
  <text x="82" y="633" class="section">B. Selected Token 的跨块上下文：2D-RoPE Self-Attention</text>
  <line x1="55" y1="653" x2="2445" y2="653" class="divider"/>

  <rect x="95" y="720" width="280" height="145" rx="8" class="global"/>
  <text x="235" y="758" class="bt">Pre LayerNorm</text>
  <text x="235" y="792" class="shape">[B,N1,768]</text>
  <text x="235" y="826" class="tx">保持 Token 数 N1 不变</text>

  <rect x="460" y="690" width="370" height="205" rx="8" class="global"/>
  <text x="645" y="728" class="bt">QKV + 12-Head Attention</text>
  <text x="645" y="762" class="shape">Q,K,V [B,12,N1,64]</text>
  <text x="645" y="795" class="tx">Q/K：前32维旋转 x 坐标</text>
  <text x="645" y="825" class="tx">Q/K：后32维旋转 y 坐标</text>
  <text x="645" y="855" class="sm">V 不施加 RoPE</text>
  <text x="645" y="880" class="sm">选中 Patch 之间建立全局关系</text>

  <rect x="920" y="720" width="280" height="145" rx="8" class="global"/>
  <text x="1060" y="758" class="bt">Attention Output</text>
  <text x="1060" y="792" class="shape">[B,N1,768]</text>
  <text x="1060" y="826" class="tx">Linear(768→768)</text>

  <rect x="1290" y="720" width="280" height="145" rx="8" class="fusion"/>
  <text x="1430" y="758" class="bt">Residual Add</text>
  <text x="1430" y="792" class="tx">selected_x + attention</text>
  <text x="1430" y="826" class="shape">[B,N1,768]</text>

  <rect x="1660" y="720" width="280" height="145" rx="8" class="fusion"/>
  <text x="1800" y="758" class="bt">Post LayerNorm</text>
  <text x="1800" y="792" class="shape">context [B,N1,768]</text>
  <text x="1800" y="826" class="tx">送入 Selected Decoder</text>

  <rect x="2040" y="700" width="300" height="185" rx="8" class="note"/>
  <text x="2190" y="740" class="warn">这一层做什么？</text>
  <text x="2190" y="779" class="tx">让每个选中块获得其他</text>
  <text x="2190" y="808" class="tx">选中块的全局结构上下文</text>
  <text x="2190" y="842" class="sm">不是块内 2048 像素注意力</text>
  <text x="2190" y="868" class="sm">注意力长度是 N1</text>

  <path d="M375 792 H460" class="arrow"/>
  <path d="M830 792 H920" class="arrow"/>
  <path d="M1200 792 H1290" class="arrow"/>
  <path d="M1570 792 H1660" class="arrow"/>
  <path d="M980 420 V670 H645 V690" class="idxarrow"/>
  <text x="1070" y="660" class="label">selected_coords [B,N1,2]</text>
  <path d="M1375 420 V650 H235 V720" class="arrow"/>
  <text x="1000" y="642" class="label">selected_x [B,N1,768]</text>

  <rect x="55" y="1065" width="2390" height="530" rx="10" class="group"/>
  <text x="82" y="1103" class="section">C. SelectedPatchDecoder：原始像素局部特征 + 768D 全局上下文 → 每像素二分类 Logit</text>
  <line x1="55" y1="1123" x2="2445" y2="1123" class="divider"/>

  <rect x="85" y="1190" width="250" height="155" rx="8" class="input"/>
  <text x="210" y="1228" class="bt">Gather 后原始块</text>
  <text x="210" y="1261" class="shape">[B×N1,3,64,32]</text>
  <text x="210" y="1294" class="tx">保留细粒度 RGB 像素</text>
  <text x="210" y="1323" class="sm">B=1 时等价 [N1,3,64,32]</text>

  <rect x="410" y="1170" width="300" height="195" rx="8" class="local"/>
  <text x="560" y="1208" class="bt">Local CNN Encoder</text>
  <text x="560" y="1241" class="tx">Conv3×3: 3→64, BN, GELU</text>
  <text x="560" y="1271" class="tx">Conv3×3 s=2: 64→128</text>
  <text x="560" y="1301" class="tx">BN, GELU</text>
  <text x="560" y="1335" class="shape">local [B×N1,128,32,16]</text>

  <rect x="410" y="1420" width="300" height="125" rx="8" class="global"/>
  <text x="560" y="1458" class="bt">Context Projection</text>
  <text x="560" y="1490" class="tx">Linear 768→128</text>
  <text x="560" y="1520" class="shape">[B×N1,128,1,1]</text>

  <rect x="805" y="1190" width="310" height="155" rx="8" class="fusion"/>
  <text x="960" y="1228" class="bt">Broadcast + Addition</text>
  <text x="960" y="1261" class="tx">context 在 32×16 广播</text>
  <text x="960" y="1294" class="tx">local + conditioning</text>
  <text x="960" y="1325" class="shape">[B×N1,128,32,16]</text>

  <rect x="1200" y="1170" width="335" height="195" rx="8" class="local"/>
  <text x="1367" y="1208" class="bt">块内 Token Transformer</text>
  <text x="1367" y="1241" class="tx">flatten spatial + transpose</text>
  <text x="1367" y="1271" class="shape">[B×N1,512,128]</text>
  <text x="1367" y="1301" class="tx">1层 Transformer，8 heads</text>
  <text x="1367" y="1331" class="sm">FFN=512，GELU</text>
  <text x="1367" y="1357" class="sm">每个 Patch 内 512 个低分辨率位置交互</text>

  <rect x="1620" y="1170" width="320" height="195" rx="8" class="local"/>
  <text x="1780" y="1208" class="bt">Reshape + Decoder</text>
  <text x="1780" y="1241" class="shape">[B×N1,128,32,16]</text>
  <text x="1780" y="1271" class="tx">ConvTranspose2d: 128→64</text>
  <text x="1780" y="1301" class="tx">上采样到 64×32</text>
  <text x="1780" y="1331" class="tx">Conv3×3: 64→32；Conv1×1: 32→1</text>

  <rect x="2035" y="1170" width="315" height="195" rx="8" class="output"/>
  <text x="2192" y="1208" class="bt">Selected Mask Logits</text>
  <text x="2192" y="1244" class="shape">[B×N1,1,64,32]</text>
  <text x="2192" y="1278" class="tx">每个像素一个二分类 Logit</text>
  <text x="2192" y="1310" class="tx">概率 = sigmoid(logit)</text>
  <text x="2192" y="1342" class="sm">不是输出 2 个通道</text>

  <path d="M335 1267 H410" class="arrow"/>
  <path d="M710 1267 H805" class="arrow"/>
  <path d="M710 1482 H760 V1310 H805" class="ctxarrow"/>
  <path d="M1115 1267 H1200" class="arrow"/>
  <path d="M1535 1267 H1620" class="arrow"/>
  <path d="M1940 1267 H2035" class="arrow"/>
  <path d="M1800 865 V1038 H560 V1420" class="ctxarrow"/>
  <text x="1180" y="1028" class="label">RoPE-enhanced context [B,N1,768]</text>

  <rect x="805" y="1405" width="1135" height="145" rx="8" class="note"/>
  <text x="1372" y="1440" class="warn">融合含义</text>
  <text x="1372" y="1475" class="tx">128D context 对一个 Patch 内所有 32×16 位置使用同一个偏置向量；它提供“这个块是什么、与其他选中块有什么关系”</text>
  <text x="1372" y="1507" class="tx">Local CNN 保留“这个块内部每个位置长什么样”；块内 Transformer 再建模 512 个局部位置之间的关系</text>
  <text x="1372" y="1536" class="sm">最终单通道 Logit 经回填形成整图 mask_logits，训练时由 Weighted BCE + Dice + Soft-clDice 监督</text>

  <text x="80" y="1640" class="subtitle">空分支保护：N1=0 时跳过 RoPE Attention 和 SelectedPatchDecoder，直接创建空张量 [0,1,64,32]，由 Remaining 分支完成回填。</text>
</svg>
