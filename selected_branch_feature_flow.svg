<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1540" viewBox="0 0 2400 1540" role="img" aria-labelledby="title desc">
<title id="title">EeTF Selected 分支详细特征流</title>
<desc id="desc">多Batch动态选中的原始64乘64 Patch和768维融合上下文进入局部Selected解码器；该路径没有Selected Patch之间的全局二维位置编码或注意力。</desc>
<defs><style>
*{font-family:Arial,'Noto Sans CJK SC',sans-serif}.bg{fill:#f7f9fc}.group{fill:#fff;stroke:#d3dce8;stroke-width:1.8}.input{fill:#e7f5f2;stroke:#2e8f83;stroke-width:2.2}.index{fill:#f2edfb;stroke:#7452a8;stroke-width:2.2}.local{fill:#fff3e5;stroke:#c77821;stroke-width:2.2}.fusion{fill:#fdf0f5;stroke:#b24e76;stroke-width:2.2}.output{fill:#e8f7e8;stroke:#438c59;stroke-width:2.2}.note{fill:#fffbea;stroke:#b58a28;stroke-width:1.8}.title{font-size:36px;font-weight:700;fill:#172033}.subtitle{font-size:18px;fill:#526174}.section{font-size:21px;font-weight:700;fill:#334155}.bt{font-size:20px;font-weight:700;fill:#172033;text-anchor:middle}.tx{font-size:16px;fill:#344257;text-anchor:middle}.sm{font-size:14px;fill:#526174;text-anchor:middle}.shape{font-size:15px;font-weight:700;fill:#1f5f78;text-anchor:middle}.label{font-size:14px;font-weight:700;fill:#315f72;text-anchor:middle}.warn{font-size:16px;font-weight:700;fill:#8a5418;text-anchor:middle}.arrow{fill:none;stroke:#397080;stroke-width:2.5;marker-end:url(#arrow)}.idx{fill:none;stroke:#7452a8;stroke-width:2.5;marker-end:url(#purple)}.ctx{fill:none;stroke:#b24e76;stroke-width:2.5;marker-end:url(#pink)}.dash{fill:none;stroke:#997125;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#gold)}.divider{stroke:#d3dce8;stroke-width:1.5;stroke-dasharray:6 8}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#397080"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#7452a8"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#b24e76"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#997125"/></marker></defs>
<rect class="bg" width="2400" height="1540"/><text x="70" y="62" class="title">Selected 分支：动态取块后的局部高精度解码</text><text x="70" y="96" class="subtitle">Patch = 64 × 64 ｜ 每个样本独立选择 N1(b) 个块 ｜ 无 Selected Patch 间全局 RoPE / Self-Attention</text>
<rect x="55" y="130" width="2290" height="390" rx="10" class="group"/><text x="82" y="168" class="section">A. Router 产生逐样本索引，并打包原始 Patch 与融合上下文</text><line x1="55" y1="188" x2="2345" y2="188" class="divider"/>
<rect x="90" y="250" width="280" height="150" rx="8" class="input"/><text x="230" y="287" class="bt">全部原始 Patch</text><text x="230" y="319" class="tx">16 × 16 网格，按行展平</text><text x="230" y="350" class="shape">[B×256,3,64,64]</text><text x="230" y="379" class="sm">保留局部 RGB 像素细节</text>
<rect x="455" y="230" width="300" height="190" rx="8" class="index"/><text x="605" y="268" class="bt">selected_indices</text><text x="605" y="301" class="shape">list[B]，每项 [N1(b)]</text><text x="605" y="333" class="tx">keep_probs ≥ threshold</text><text x="605" y="363" class="tx">每个样本的 Patch 整数索引</text><text x="605" y="393" class="sm">N1(b) 可不同，也可为 0</text>
<rect x="840" y="230" width="335" height="190" rx="8" class="fusion"/><text x="1007" y="268" class="bt">selected_features</text><text x="1007" y="301" class="shape">[M1,768]，M1 = Σ N1(b)</text><text x="1007" y="333" class="tx">由 CNN 和 28D 统计 MLP 融合</text><text x="1007" y="363" class="tx">按 selected_indices 打包</text><text x="1007" y="393" class="sm">每个 Patch 自己的上下文向量</text>
<rect x="1260" y="230" width="335" height="190" rx="8" class="input"/><text x="1427" y="268" class="bt">selected_patches</text><text x="1427" y="301" class="shape">[M1,3,64,64]</text><text x="1427" y="333" class="tx">先 reshape [B,256,3,64,64]</text><text x="1427" y="363" class="tx">再按样本和索引 gather</text><text x="1427" y="393" class="sm">与 selected_features 顺序一致</text>
<rect x="1690" y="230" width="590" height="190" rx="8" class="note"/><text x="1985" y="271" class="warn">路由与解码边界</text><text x="1985" y="310" class="tx">Router 的跨块邻域信息已经在完整 16 × 16 Patch Grid 的 Cross-Block CNN 中建模。</text><text x="1985" y="345" class="tx">Selected 分支不使用绝对 Patch 坐标，也不让动态选择的 Patch 集合互相做全局注意力。</text><text x="1985" y="382" class="tx">这避免将零件位置或不稳定的 Selected 集合关系写入局部像素解码。</text>
<path d="M370 325H455" class="idx"/><path d="M755 325H840" class="idx"/><path d="M755 365H800V440H1427V420" class="idx"/><text x="1110" y="462" class="label">sample_id + Patch index gather</text>
<rect x="55" y="565" width="2290" height="510" rx="10" class="group"/><text x="82" y="603" class="section">B. SelectedPatchDecoder：局部 CNN、768D 条件向量与块内空间 Transformer</text><line x1="55" y1="623" x2="2345" y2="623" class="divider"/>
<rect x="90" y="700" width="275" height="185" rx="8" class="local"/><text x="227" y="738" class="bt">Local CNN Encoder</text><text x="227" y="771" class="tx">Conv3×3: 3→64，BN，GELU</text><text x="227" y="801" class="tx">Conv3×3 stride=2: 64→128</text><text x="227" y="831" class="tx">BN，GELU</text><text x="227" y="862" class="shape">local [m,128,32,32]</text>
<rect x="450" y="700" width="275" height="185" rx="8" class="fusion"/><text x="587" y="738" class="bt">Context Projection</text><text x="587" y="771" class="tx">Linear 768→128</text><text x="587" y="801" class="tx">reshape 为 [m,128,1,1]</text><text x="587" y="831" class="tx">广播到全部局部位置</text><text x="587" y="862" class="shape">conditioning [m,128,32,32]</text>
<rect x="810" y="700" width="295" height="185" rx="8" class="fusion"/><text x="957" y="738" class="bt">Feature Addition</text><text x="957" y="771" class="tx">local + conditioning</text><text x="957" y="801" class="tx">同一 Patch 内每个位置</text><text x="957" y="831" class="tx">获得其融合 Token 条件</text><text x="957" y="862" class="shape">[m,128,32,32]</text>
<rect x="1190" y="680" width="355" height="225" rx="8" class="local"/><text x="1367" y="718" class="bt">块内 Token Transformer</text><text x="1367" y="751" class="tx">flatten spatial：32 × 32 = 1024 tokens</text><text x="1367" y="781" class="shape">[m,1024,128]</text><text x="1367" y="811" class="tx">2 层 Transformer，8 heads，GELU</text><text x="1367" y="841" class="tx">仅每个 Patch 内的空间位置交互</text><text x="1367" y="874" class="sm">注意力长度固定为单个 Patch 的 1024 个局部位置</text>
<rect x="1630" y="700" width="295" height="185" rx="8" class="local"/><text x="1777" y="738" class="bt">Pixel Decoder</text><text x="1777" y="771" class="tx">reshape [m,128,32,32]</text><text x="1777" y="801" class="tx">ConvTranspose2d: 128→64</text><text x="1777" y="831" class="tx">Conv3×3: 64→32；Conv1×1: 32→1</text><text x="1777" y="862" class="shape">[m,1,64,64]</text>
<rect x="2010" y="700" width="270" height="185" rx="8" class="output"/><text x="2145" y="738" class="bt">Selected Mask Logits</text><text x="2145" y="771" class="shape">[M1,1,64,64]</text><text x="2145" y="801" class="tx">每像素一个二分类 Logit</text><text x="2145" y="831" class="tx">sigmoid 后才是概率</text><text x="2145" y="862" class="sm">不是两通道输出</text>
<path d="M365 792H450" class="arrow"/><path d="M725 792H810" class="ctx"/><path d="M1105 792H1190" class="arrow"/><path d="M1545 792H1630" class="arrow"/><path d="M1925 792H2010" class="arrow"/><path d="M1427 420V645H587V700" class="arrow"/><path d="M1007 420V650H587V700" class="ctx"/><text x="780" y="645" class="label">packed Patch 与对应 768D context</text>
<rect x="55" y="1120" width="2290" height="320" rx="10" class="group"/><text x="82" y="1158" class="section">C. 空分支与批量回填</text><line x1="55" y1="1178" x2="2345" y2="1178" class="divider"/>
<rect x="110" y="1240" width="450" height="130" rx="8" class="note"/><text x="335" y="1278" class="bt">空 Selected 分支</text><text x="335" y="1310" class="tx">某样本 N1(b)=0 时不调用 SelectedPatchDecoder</text><text x="335" y="1340" class="sm">创建 [0,1,64,64]；该样本由 Remaining 分支填充</text>
<rect x="700" y="1240" width="450" height="130" rx="8" class="index"/><text x="925" y="1278" class="bt">动态索引回填</text><text x="925" y="1310" class="tx">逐样本读取 N1(b) 与 N2(b) 的连续 packed 片段</text><text x="925" y="1340" class="sm">写入各自 selected_indices / remaining_indices</text>
<rect x="1290" y="1240" width="450" height="130" rx="8" class="output"/><text x="1515" y="1278" class="bt">完整图像 Logits</text><text x="1515" y="1310" class="tx">[B,256,1,64,64] → 按 16 × 16 网格重排</text><text x="1515" y="1340" class="shape">mask_logits [B,1,1024,1024]</text>
<rect x="1880" y="1240" width="350" height="130" rx="8" class="note"/><text x="2055" y="1278" class="bt">监督位置</text><text x="2055" y="1310" class="tx">Weighted BCE + Dice + Soft-clDice</text><text x="2055" y="1340" class="sm">在完整回填掩码上计算</text>
<path d="M2145 885V1190H925V1240" class="idx"/><path d="M1150 1305H1290" class="arrow"/><path d="M1740 1305H1880" class="dash"/>
<text x="70" y="1495" class="subtitle">Selected 分支的空间关系限定在单个 64 × 64 Patch 内；跨块邻域关系只在 Router 前的完整 Patch Grid Cross-Block 模块中计算。</text>
</svg>
